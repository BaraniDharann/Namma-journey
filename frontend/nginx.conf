worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # SockJS uses a real WebSocket when it can and falls back to XHR polling when it cannot.
    # Both arrive at the same location, so Connection cannot simply be hardcoded to "upgrade":
    # sending that on a plain polling request is malformed. This maps it per request instead.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker's embedded DNS. "backend" resolves to every replica's IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Every backend replica, with one browser kept on one replica - SockJS falls back to XHR
    # streaming on networks that block WebSockets, and those requests must reach the server
    # holding the session. With one backend (the default compose file) this is that one server.
    upstream backend_pool {
        # zone + resolve: the replica list is re-read from DNS every 10s. It used to be resolved
        # once at nginx start, so a restarted or newly scaled replica (new IP) got no traffic and
        # a removed one kept getting it until nginx was reloaded. It also lets nginx start while
        # the backend is still down instead of refusing to boot.
        zone backend_pool 64k;
        # Not ip_hash: for IPv4 it hashes only the first three octets, so everyone in a /24 -
        # and carrier NAT puts huge numbers of Jio/Airtel users in a few of them - piled onto one
        # replica. consistent also means adding a replica moves only ~1/N of the clients.
        hash $remote_addr consistent;
        # Three failures inside 10s takes a replica out for 10s (passive health check), so a
        # crashed or still-booting replica stops receiving requests instead of answering 502s.
        server backend:8080 resolve max_fails=3 fail_timeout=10s;
        # Reused connections to the backend instead of a TCP handshake per request. Needs
        # HTTP/1.1 and an empty Connection header in each proxying location.
        keepalive 32;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 256;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Connection limits
        limit_conn addr 100;
        limit_conn_status 429;
        limit_req_status 429;

        # Security headers (CSP, frame, sniffing, referrer, HSTS) on every response.
        include /etc/nginx/security-headers.conf;

        # Cache static assets for 1 year
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            # This location sets its own header, which makes nginx drop the inherited ones.
            include /etc/nginx/security-headers.conf;
            access_log off;
        }

        # Proxy API requests to backend
        location /api/ {
            # A dashboard render is ~30 calls at once; burst 20 answered the rest with 503s that
            # the app reported as "servers unavailable". The backend limiter (per account) is the
            # real budget; this only blunts floods from one address. 429, not 503, when it bites.
            limit_req zone=api burst=60 nodelay;
            # Driver sign-up sends up to four documents as raw phone photos; matches Spring's
            # multipart max-request-size (125MB, 30MB per file) - ImageCompressor shrinks them
            # after. nginx's default 1MB answered every normal phone photo with 413.
            client_max_body_size 125m;
            # A replica that refuses the connection, times out connecting or answers 502/503 is
            # skipped for the next one. nginx never resends a POST/PUT/PATCH on its own
            # (non_idempotent is not listed), so a booking or payment is never submitted twice.
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 3s;
            # Above the backend's own bounds (15s statement timeout, 5s external calls), so the
            # backend answers first and nginx's 504 only means the replica is truly stuck.
            proxy_read_timeout 30s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://backend_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # One id from the edge to the backend logs (RequestIdFilter keeps a well-formed one).
            proxy_set_header X-Request-Id $request_id;
        }

        # Uploaded images (driver photos, trip photos, signed identity documents) are served by the
        # backend. ^~ wins over the static-file regex above, which used to answer these with 404
        # because no such file exists in the frontend image.
        location ^~ /uploads/ {
            # Each image is a Postgres read plus a decrypt (STORAGE_TYPE=db) and the backend
            # limiter exempts this path, so this is the only brake on hammering it. A page shows
            # a handful of photos; burst 40 covers a long driver list rendering at once.
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
        }

        location ^~ /driverphoto/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
        }
        # Self-hosted OSRM (docker-compose.prod.yml) for the browser's route previews, built with
        # VITE_OSRM_BASE_URL=/osrm so it stays same-origin. Resolved per request through Docker's
        # DNS, so nginx still starts in the single-server setup where no osrm service exists
        # (these requests then fail and the app falls back to the straight-line estimate).
        location /osrm/ {
            limit_req zone=api burst=20 nodelay;
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $osrm_upstream http://osrm:5000;
            rewrite ^/osrm/(.*)$ /$1 break;
            proxy_pass $osrm_upstream;
            proxy_read_timeout 10s;
        }

        # Live tracking. SockJS upgrades to a WebSocket here when it can, which needs the two
        # Upgrade headers below and a long read timeout — the default 60s would tear down an idle
        # tracking session mid-trip. proxy_buffering off keeps STOMP frames from being held
        # back, and this is deliberately outside the api rate-limit zone: one connection
        # carries a whole trip, and location frames must not be throttled as if they were
        # separate API calls.
        location /ws/ {
            proxy_pass http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
