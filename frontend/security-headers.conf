# Security headers for every response nginx serves. Included in each location that sets its own
# add_header, because nginx drops ALL inherited add_header lines the moment a location adds one.
#
# Content-Security-Policy: the login token lives in localStorage, so any script injected into
# the page could read it. CSP is the brake: scripts only from this site and Google sign-in.
#   img-src     map tiles, Leaflet markers (unpkg / GitHub), Google profile photos, and the
#               S3/R2 hosts uploads redirect to when STORAGE_TYPE=s3
#   connect-src the API (same origin, or the nammajourneys.site / Render backend origins the
#               production builds point at), routing (OSRM), place search (Photon), Google sign-in
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://nammajourneys.site https://namma-journey-backend.onrender.com https://*.tile.openstreetmap.org https://tile.openstreetmap.org https://unpkg.com https://raw.githubusercontent.com https://*.googleusercontent.com https://*.r2.cloudflarestorage.com https://*.amazonaws.com https://cdn.razorpay.com; connect-src 'self' https://nammajourneys.site wss://nammajourneys.site https://namma-journey-backend.onrender.com wss://namma-journey-backend.onrender.com https://router.project-osrm.org https://photon.komoot.io https://accounts.google.com https://api.razorpay.com https://lumberjack.razorpay.com; frame-src https://accounts.google.com https://api.razorpay.com https://checkout.razorpay.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
# One year of HTTPS-only. Harmless over plain http (browsers ignore it there); effective as soon as
# TLS is terminated in front of this container.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
