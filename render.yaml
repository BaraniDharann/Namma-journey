databases:
  - name: namma-journey-db
    plan: free
    databaseName: namma_journey
    user: namma_journey

services:
  - type: web
    name: namma-journey-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      # --- Database: user/password come from the Render Postgres above automatically.
      - key: DB_USERNAME
        fromDatabase:
          name: namma-journey-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: namma-journey-db
          property: password
      # DB_URL needs the JDBC form (jdbc:postgresql://host:port/db), which Render doesn't
      # expose as a single property — copy host/port/database off the Postgres dashboard's
      # "Internal Database URL" once, see step 3 below. sync:false means it's set once in
      # the Render dashboard, never written into this committed file.
      - key: DB_URL
        sync: false

      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"

      - key: APP_CACHE_TYPE
        value: caffeine
      - key: MANAGEMENT_HEALTH_REDIS_ENABLED
        value: "false"

      - key: JPA_DDL_AUTO
        value: validate
      - key: OTP_TEST_MODE
        value: "false"
      # Render's free plan has no persistent disk: with local storage every deploy or restart
      # DELETES uploaded driver documents and trip photos. Before real use, create a Cloudflare
      # R2 bucket and add (in the dashboard): STORAGE_TYPE=s3, S3_BUCKET, S3_REGION=auto,
      # S3_ENDPOINT=https://<account-id>.r2.cloudflarestorage.com, S3_ACCESS_KEY, S3_SECRET_KEY.
      - key: FILE_UPLOAD_DIR
        value: uploads

      # Render terminates TLS and is the only path in, so its edge is trusted for
      # X-Forwarded-For. With "*" the backend believes only the rightmost hop - the one Render's
      # edge appends - so a client-supplied X-Forwarded-For cannot change its identity
      # (ClientIpResolver). Still: never use "*" anywhere reachable without a proxy in front.
      - key: RATELIMIT_TRUSTED_PROXIES
        value: "*"
      - key: RATELIMIT_AUTH
        value: "10"
      - key: RATELIMIT_AUTHENTICATED
        value: "200"
      - key: RATELIMIT_GENERAL
        value: "60"
      - key: RATELIMIT_PAYMENT
        value: "15"

      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      - key: PHOTON_BASE_URL
        value: https://photon.komoot.io
      - key: TELEGRAM_ENABLED
        value: "false"
      - key: TELEGRAM_API_BASE_URL
        value: https://api.telegram.org

      # https://nammajourneys.site, plus the Render static-site URL if you also use that (step 4).
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # Real secrets — never put actual values in this file. sync:false makes Render prompt
      # for them once in the dashboard instead.
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_NAME
        value: Namma Journey
      - key: OWNER_UPI_ID
        sync: false
      - key: OWNER_UPI_NAME
        value: Namma Journey
      # Razorpay online checkout. Webhook URL to register in the Razorpay dashboard:
      # https://api.nammajourneys.site/api/payments/razorpay/webhook
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Leave empty after first owner is created — see step 6.
      - key: OWNER_BOOTSTRAP_SECRET
        sync: false

  - type: web
    name: namma-journey-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      # The backend's custom domain (Render: backend service -> Settings -> Custom Domains). Until
      # it is attached, use https://namma-journey-backend.onrender.com/api instead.
      - key: VITE_API_BASE_URL
        value: https://api.nammajourneys.site/api
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_OSRM_BASE_URL
        value: https://router.project-osrm.org
      - key: VITE_PHOTON_BASE_URL
        value: https://photon.komoot.io
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Same security headers the Docker nginx sends (frontend/security-headers.conf). The static
    # site has no nginx, so Render has to add them. CSP is what stops an injected script from
    # reading the login token out of localStorage.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://accounts.google.com https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://api.nammajourneys.site https://namma-journey-backend.onrender.com https://*.tile.openstreetmap.org https://tile.openstreetmap.org https://unpkg.com https://raw.githubusercontent.com https://*.googleusercontent.com https://*.r2.cloudflarestorage.com https://*.amazonaws.com https://cdn.razorpay.com; connect-src 'self' https://api.nammajourneys.site wss://api.nammajourneys.site https://namma-journey-backend.onrender.com wss://namma-journey-backend.onrender.com https://router.project-osrm.org https://photon.komoot.io https://accounts.google.com https://api.razorpay.com https://lumberjack.razorpay.com; frame-src https://accounts.google.com https://api.razorpay.com https://checkout.razorpay.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
