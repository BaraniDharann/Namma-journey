databases:
  - name: namma-journey-db
    plan: free
    databaseName: namma_journey
    user: namma_journey

services:
  - type: web
    name: namma-journey-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      # --- Database: user/password come from the Render Postgres above automatically.
      - key: DB_USERNAME
        fromDatabase:
          name: namma-journey-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: namma-journey-db
          property: password
      # DB_URL needs the JDBC form (jdbc:postgresql://host:port/db), which Render doesn't
      # expose as a single property — copy host/port/database off the Postgres dashboard's
      # "Internal Database URL" once, see step 3 below. sync:false means it's set once in
      # the Render dashboard, never written into this committed file.
      - key: DB_URL
        sync: false

      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"

      - key: APP_CACHE_TYPE
        value: caffeine
      - key: MANAGEMENT_HEALTH_REDIS_ENABLED
        value: "false"

      - key: JPA_DDL_AUTO
        value: validate
      - key: OTP_TEST_MODE
        value: "false"
      - key: FILE_UPLOAD_DIR
        value: uploads

      # Render terminates TLS and is the only path in, so its edge is trusted for
      # X-Forwarded-For. Do not set this to "*" anywhere reachable directly from the internet.
      - key: RATELIMIT_TRUSTED_PROXIES
        value: "*"
      - key: RATELIMIT_AUTH
        value: "10"
      - key: RATELIMIT_AUTHENTICATED
        value: "200"
      - key: RATELIMIT_GENERAL
        value: "60"
      - key: RATELIMIT_PAYMENT
        value: "15"

      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      - key: PHOTON_BASE_URL
        value: https://photon.komoot.io
      - key: TELEGRAM_ENABLED
        value: "false"
      - key: TELEGRAM_API_BASE_URL
        value: https://api.telegram.org

      # Point this at the frontend URL once Render assigns it (step 4).
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # Real secrets — never put actual values in this file. sync:false makes Render prompt
      # for them once in the dashboard instead.
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_NAME
        value: Namma Journey
      - key: OWNER_UPI_ID
        sync: false
      - key: OWNER_UPI_NAME
        value: Namma Journey
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Leave empty after first owner is created — see step 6.
      - key: OWNER_BOOTSTRAP_SECRET
        sync: false

  - type: web
    name: namma-journey-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://namma-journey-backend.onrender.com/api
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_OSRM_BASE_URL
        value: https://router.project-osrm.org
      - key: VITE_PHOTON_BASE_URL
        value: https://photon.komoot.io
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
