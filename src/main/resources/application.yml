spring:
  application:
    name: travel-booking-platform

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 16
  
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 20MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Async task executor
  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 100

  # Redis (used as distributed cache). Falls back to in-memory Caffeine
  # automatically if Redis is unreachable or app.cache.type=caffeine.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      connect-timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 1000ms
        shutdown-timeout: 100ms

# Application-level cache toggle: "redis" (default) or "caffeine"
app:
  cache:
    type: ${APP_CACHE_TYPE:redis}
    default-ttl-minutes: 10

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024
  tomcat:
    threads:
      max: 200
      min-spare: 20
    max-connections: 10000
    accept-count: 100

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

mail:
  from:
    name: ${MAIL_FROM_NAME:Namma Journey}

# OTP Configuration
otp:
  expiry:
    minutes: ${OTP_EXPIRY_MINUTES:5}
  test:
    mode: ${OTP_TEST_MODE:false}

# File Upload Configuration
file:
  upload:
    dir: ${FILE_UPLOAD_DIR:uploads/drivers}

# Payment Configuration
payment:
  upi:
    id: ${OWNER_UPI_ID:sarasarathy86@okicici}
    name: ${OWNER_UPI_NAME:Namma Journey}

logging:
  level:
    com.travelplatform: INFO
    org.springframework.security: WARN

# GraphHopper Routing Configuration
graphhopper:
  enabled: false
  cache:
    path: graphhopper-cache

osm:
  file:
    path: src/india-latest.osm.pbf

# Actuator & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,caches
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: travel-booking-platform
