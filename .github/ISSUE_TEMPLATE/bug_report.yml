name: Bug Report
description: Something isn't working as expected
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. The most useful thing you can give us is a reliable
        reproduction — everything else we can usually work out from there.

        **Security vulnerability?** Don't file it here — see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Log in as a driver
        2. Open the bookings page
        3. Accept a trip
        4. ...
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: Which role were you logged in as?
      options:
        - User (customer)
        - Driver
        - Owner
        - Not logged in / public page
        - Not applicable (API or backend only)
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      multiple: true
      options:
        - Backend (Spring Boot API)
        - Frontend (React)
        - Database / migrations
        - Live tracking (WebSocket)
        - Telegram dispatch
        - Payments
        - Email / OTP
        - Deployment (Docker, CI)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or stack trace
      description: Backend errors are in `logs/`. Please redact any tokens or personal data.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "e.g. main @ 150b84a"

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS:        Ubuntu 24.04
        Java:      17.0.10
        Node:      20.11
        Database:  PostgreSQL 15
        Run via:   docker compose / local
