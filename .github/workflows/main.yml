name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned to a commit: tags can be moved)
        with:
          fetch-depth: 0   # gitleaks scans history, not just the tip

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2 (pinned to a commit: tags can be moved)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned to a commit: tags can be moved)

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4 (pinned to a commit: tags can be moved)
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Run tests
        run: mvn -B test

      - name: Upload JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (pinned to a commit: tags can be moved)
        with:
          name: backend-jar
          path: target/*.jar

  frontend:
    name: Build & Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned to a commit: tags can be moved)

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned to a commit: tags can be moved)
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (pinned to a commit: tags can be moved)
        with:
          name: frontend-dist
          path: frontend/dist

  # Images are built here, never on the server: the Maven and Vite builds were the biggest memory
  # spikes on a 2 GB EC2, and the server now only runs "docker pull" (scripts/deploy.sh).
  # GitHub Container Registry needs no secrets (the workflow's own GITHUB_TOKEN can push) and is
  # free for public images. Forks never push to this repository's main, so no credential gate.
  docker:
    name: Build & Push Docker Images
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned to a commit: tags can be moved)

      # Registry paths must be lowercase; the owner (BaraniDharann) is not.
      - name: Image names
        id: names
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/namma-journey"
          echo "backend=${prefix}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${prefix}-frontend" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3 (pinned to a commit: tags can be moved)

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3 (pinned to a commit: tags can be moved)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags each: the commit sha, which a deploy or a rollback names exactly
      # (scripts/deploy.sh <sha>), and latest, the default.
      - name: Build & push backend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5 (pinned to a commit: tags can be moved)
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.backend }}:latest
            ${{ steps.names.outputs.backend }}:${{ github.sha }}
          # Links the package to this repository on GitHub (its page, its permissions).
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # VITE_* are inlined into the bundle at build time, so they come in as build args. They are
      # public by nature (they ship to every browser), so repository variables, not secrets:
      # Settings -> Secrets and variables -> Actions -> Variables. Unset ones build as empty.
      - name: Build & push frontend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5 (pinned to a commit: tags can be moved)
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
            VITE_OSRM_BASE_URL=${{ vars.VITE_OSRM_BASE_URL }}
            VITE_PHOTON_BASE_URL=${{ vars.VITE_PHOTON_BASE_URL }}
          tags: |
            ${{ steps.names.outputs.frontend }}:latest
            ${{ steps.names.outputs.frontend }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
