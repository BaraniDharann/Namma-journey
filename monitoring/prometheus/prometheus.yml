# Scrapes the backend's Micrometer metrics every 15s and evaluates the alert rules.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: namma-backend
    metrics_path: /actuator/prometheus
    # /actuator/prometheus refuses anyone without METRICS_SCRAPE_TOKEN
    # (ScrapeTokenAuthorizationManager). docker-compose mounts the token as this file.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/scrape-token
    # Every backend replica as its own target, re-read from Docker's DNS. A static "backend:8080"
    # hit one replica at random per scrape, so with two (BACKEND_REPLICAS, or the minute a rolling
    # deploy runs old and new side by side) their counters were mixed into one jumping series.
    dns_sd_configs:
      - names: ["backend"]
        type: A
        port: 8080
        refresh_interval: 15s
