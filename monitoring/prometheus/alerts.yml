# Alert rules. Each one names a user-visible symptom, not just a number crossing a line.
# Visible at http://localhost:9090/alerts and on the Grafana dashboard. To be paged, point an
# Alertmanager at this Prometheus (alerting.alertmanagers in prometheus.yml).
groups:
  - name: namma-journey
    rules:
      - alert: BackendDown
        # Replicas are discovered through DNS, so with every backend gone there is no target and
        # no "up" series at all - absent() catches that; the sum catches all targets failing.
        expr: sum(up{job="namma-backend"}) < 1 or absent(up{job="namma-backend"})
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Backend is not answering - nobody can book or track a trip"

      - alert: HighErrorRate
        # Share of API requests answered with a 5xx over the last 5 minutes.
        expr: |
          sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*", status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m])), 1e-9)
            > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "More than 5% of requests are failing with server errors"

      - alert: SlowRequests
        # p95 across every endpoint and instance. Above 2s users notice and start re-tapping.
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[5m]))) > 2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "95th percentile response time is above 2 seconds"

      - alert: DatabasePoolExhausted
        # Requests are queueing for one of the 20 pooled connections. Next stop: timeouts.
        expr: max(hikaricp_connections_pending) > 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Requests are waiting for a database connection"

      - alert: NotificationsFailing
        # Telegram/email sends that failed or were dropped. Drivers may be missing trip offers.
        expr: sum(increase(namma_notifications_dispatch_total{outcome!="sent"}[15m])) > 5
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "Telegram or email notifications are failing - drivers may not hear about trips"

      - alert: OutboxJobsDead
        # A queued email or refund gave up after every retry. A refund here means a passenger
        # is owed money: check outbox_events WHERE status = 'DEAD' (or the SQS dead-letter queue).
        expr: sum(increase(namma_outbox_jobs_total{outcome="dead"}[1h])) > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "A background job (email or Razorpay refund) failed permanently"

      - alert: OutboxJobsFailing
        # Jobs are failing and being retried - SMTP or Razorpay is probably down.
        expr: sum(increase(namma_outbox_jobs_total{outcome="failed"}[15m])) > 10
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "Background jobs keep failing and retrying"

      - alert: ThirdPartyCircuitOpen
        # A provider (razorpay, telegram, osrm-eta, routing, places) kept failing, so calls to it
        # are refused at once (ExternalHttpClients). razorpay open = no online payments; telegram
        # open = drivers not pinged; osrm-eta/routing/places = straight-line estimates only.
        expr: max by (name) (resilience4j_circuitbreaker_state{state="open"}) == 1
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.name }} is failing - its circuit breaker is open and calls fail fast"

      - alert: ThirdPartyBulkheadFull
        # 20 calls to one provider in flight at once on an instance: it is slow, not down, and
        # further calls are being refused so it cannot hold every request thread.
        expr: min by (name) (resilience4j_bulkhead_available_concurrent_calls) == 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.name }} is slow - its bulkhead is full and extra calls are refused"

      - alert: HeavyRateLimiting
        # Sustained 429s: either an attack, or limits set too tight for real traffic.
        expr: sum(rate(http_server_requests_seconds_count{status="429"}[5m])) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "More than one request per second is being rate limited"

      - alert: HeapNearlyFull
        expr: |
          sum(jvm_memory_used_bytes{area="heap"}) / sum(jvm_memory_max_bytes{area="heap"}) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "JVM heap above 90% for 10 minutes - risk of OutOfMemoryError"
